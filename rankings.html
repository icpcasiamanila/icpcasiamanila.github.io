<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>2025 ICPC Asia-Manila Programming Contest</title>
    <link rel="stylesheet" href="./main.css" media="all">
    <link rel="stylesheet" href="./css/sizing.css" type="text/css" media="all" />
    <script src="https://kit.fontawesome.com/862f24a7ca.js" crossorigin="anonymous"></script>
  </head>
  <body>
    <header class="site-header">
      <div id="home-container">
        <button class="btn-outline" id="menu">Menu</button>
        <a href="./index.html" class="logo">
          <img src="./images/AsiaMNL_Short.png" alt="ICPC Manila Logo">
        </a>
      </div>
      <div>
        <img src="./images/icpcf-logo-header_8x.png" alt="ICPC Manila Logo">
        <img src="./images/sponsor-logo-jb-rgb6x.png" alt="ICPC Manila Logo">
      </div>
    </header>
    <nav>
      <ul>
        <li id="home-link"><a href="./index.html">Home</a></li>

<!-- 
        <li><a href="./accommodations.html">Accommodations</a></li>        
        <li><a href="./downloads.html">Downloads</a></li>
        <li><a href="./archive/2022/scoreboard">Scoreboard</a></li> 
-->
      </ul>
    </nav>
    <main>
      <section class="page-header">
        <svg
               width="768"
               height="90"
               viewBox="0 0 768 90"
               fill="none"
               xmlns="http://www.w3.org/2000/svg"
               id="bottom-corner">
          <path d="M523.101 67.5L244.913 59.5588L0 90H776V0L523.101 67.5Z" id="path2"/>
        </svg>
        <div class="page-header-content">
          <h1 class="page-title">Final Scoreboard</h1>
        </div>
      </section>
	  <section>
	  <img src="images/finalscoreboard.png" align="center" width="80%">
	  </section>
    </main>
    <footer>
      <div class="footer-content">
        <section>
          <h5>Sitemap</h5>
          <ul id="sitemap">
          </ul>
        </section>
        <section>
          <h5>External Links</h5>
          <ul id="externalLinks">
          </ul>
        </section>
        <section class="footer_logos">
          <img src="./images/ICPC_Foundation.png" alt="">
          <img src="./images/Logo_ADMU_Seal.png" alt="">
        </section>
      </div>
    </footer>
    <script>
      let menu = document.querySelector('#menu')
      menu.addEventListener('click', function() {
        document.querySelector('nav').classList.toggle('slide-menu')
        document.querySelectorAll('.site-header, main, footer').forEach(el => {
          el.classList.toggle('slide-in')
        })
      })
      let rows = document.querySelectorAll('#size-guide-wide tr')
      let table_cells = document.querySelectorAll('#size-guide-wide tbody td')
      table_cells.forEach(el => {
        el.addEventListener('mouseover', (evt) => {
          console.log(evt.target)
          console.log(Array.prototype.slice.call(evt.target.parentNode.children).indexOf(evt.target))
          let idx = Array.prototype.slice.call(evt.target.parentNode.children).indexOf(evt.target)
          rows.forEach(row => { row.children[idx].classList.toggle('highlight') })
        })
      })
      table_cells.forEach(el => {
        el.addEventListener('mouseout', (evt) => {
          console.log(evt.target)
          console.log(Array.prototype.slice.call(evt.target.parentNode.children).indexOf(evt.target))
          let idx = Array.prototype.slice.call(evt.target.parentNode.children).indexOf(evt.target)
          rows.forEach(row => { row.children[idx].classList.toggle('highlight') })
        })
      })
    </script>
    <script src="./link.js"></script>
  </body>
</html>
